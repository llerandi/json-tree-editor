[package]
name = "json-tree-editor"
version = "0.1.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "1", features = [
  "dialog-save",
  "dialog-open",
  "fs-write-file",
  "fs-read-file",
] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
